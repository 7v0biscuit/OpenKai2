name: Component tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: components-${{ github.ref }}
  cancel-in-progress: true

jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Test Windows launcher updates
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run([sys.executable, 'tools/native/test-launcher-update.py'],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  text=True, encoding='utf-8', errors='replace')
          print(result.stdout, flush=True)
          if result.returncode:
              message = result.stdout[-12000:]
              for start in range(0, len(message), 3000):
                  part = message[start:start+3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Launcher update recovery::' + part, flush=True)
          sys.exit(result.returncode)
      - name: Build and run native component comparisons
        run: python tools/probes/run.py --skip-retail
      - name: Build component test targets
        run: cmake --build build/probes --config Release --parallel 2
      - name: Build Windows launcher interaction checks
        if: runner.os == 'Windows'
        run: cmake --build build/probes --config Release --target openkai2_launcher_ui_tests openkai2_discord_tests --parallel 2
      - name: Run component tests
        run: ctest --test-dir build/probes -C Release --output-on-failure --no-tests=error
  windows-launcher-integration:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check launcher in the runtime build with debug symbols
        shell: python
        run: |
          import importlib.util, os, subprocess
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('windows_builder', 'tools/native/build-windows.py')
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          work = root / '.local/launcher-integration'
          upstream, build = work / 'PS2Recomp', work / 'build'
          upstream.mkdir(parents=True)
          os.environ['OPENKAI2_WORK_DIR'] = work.as_posix()
          def run(*args):
              subprocess.run(list(map(str, args)), check=True)
          run('git', '-C', upstream, 'init')
          run('git', '-C', upstream, 'fetch', '--depth', '1', 'https://github.com/ran-j/PS2Recomp.git', builder.PIN)
          run('git', '-C', upstream, 'checkout', '--detach', 'FETCH_HEAD')
          run('cmake', '-S', upstream, '-B', build, '-G', 'Visual Studio 17 2022', '-A', 'x64',
              '-DPS2X_BUILD_RECOMP=OFF', '-DPS2X_BUILD_ANALYZER=OFF', '-DPS2X_BUILD_TEST=OFF',
              '-DPS2X_BUILD_STUDIO=OFF', '-DPS2X_BUILD_RUNTIME=ON', '-DPS2X_ENABLE_DEBUG_UI=OFF',
              '-DPS2X_ENABLE_AGRESSIVE_LOGS=OFF', '-DOPENKAI2_RUNTIME_TESTS_ONLY=ON',
              '-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=' + (root / 'tools/native/attach-game.cmake').as_posix())
          run('cmake', '--build', build, '--config', 'RelWithDebInfo', '--target', 'openkai2_launcher_ui_tests', '--parallel', '2')
          result = subprocess.run(['ctest', '--test-dir', str(build), '-C', 'RelWithDebInfo',
                                   '-R', '^launcher_native_interaction$', '--output-on-failure', '--no-tests=error'],
                                  capture_output=True, text=True)
          print(result.stdout, result.stderr)
          if result.returncode:
              text = result.stdout[-16000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Launcher integration::' + text)
          raise SystemExit(result.returncode)
  windows-tools:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows development tools without game data
        shell: python
        run: |
          import collections, re, subprocess, sys
          sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          tail = collections.deque(maxlen=400)
          command = [sys.executable, 'tools/native/build-windows.py', '--tools-only', '--jobs', '2']
          process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                     text=True, encoding='utf-8', errors='replace')
          for line in process.stdout:
              print(line, end='', flush=True)
              tail.append(line)
          code = process.wait()
          if code:
              lines = list(tail)
              selected = set()
              for index, line in enumerate(lines):
                  if re.search(r'error [A-Z]+\d|error:|FAILED|failed|Traceback|regression|Assertion|ui:fault|ui:stack|ui:stage', line, re.IGNORECASE):
                      selected.update(range(max(0, index - 2), min(len(lines), index + 4)))
              messages = [('Windows source build tail', ''.join(lines)[-3500:])]
              details = ''.join(lines[index] for index in sorted(selected))[-12000:]
              for start in range(0, len(details), 3000):
                  messages.append(('Windows source build details ' + str(start // 3000 + 1), details[start:start+3000]))
              for title, message in messages:
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=' + title + '::' + message, flush=True)
          sys.exit(code)
  linux-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mesa and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri libegl-mesa0 libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb xauth
      - name: Require GPU rendering and video-memory comparisons
        shell: python
        run: |
          import collections, subprocess, sys
          tail = collections.deque(maxlen=160)
          process = subprocess.Popen([sys.executable, 'tools/native/test-gpu-linux.py', '--jobs', '2'],
                                     stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          for line in process.stdout:
              print(line, end='', flush=True)
              tail.append(line)
          code = process.wait()
          if code:
              details = ''.join(tail)[-12000:]
              for start in range(0, len(details), 3000):
                  message = details[start:start+3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=GPU source build details::' + message, flush=True)
          sys.exit(code)
