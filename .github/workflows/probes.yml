name: Component tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and run native component comparisons
        run: python tools/probes/run.py --skip-retail
      - name: Build ISO verification tests
        run: cmake --build build/probes --config Release --target openkai2_disc_tests openkai2_disc_verify --parallel 2
      - name: ISO verification tests
        run: ctest --test-dir build/probes -C Release --output-on-failure --no-tests=error
  windows-tools:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows development tools without game data
        shell: python
        run: |
          import collections, re, subprocess, sys
          tail = collections.deque(maxlen=400)
          command = [sys.executable, 'tools/native/build-windows.py', '--tools-only', '--jobs', '2']
          process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                     text=True, encoding='utf-8', errors='replace')
          for line in process.stdout:
              print(line, end='', flush=True)
              tail.append(line)
          code = process.wait()
          if code:
              lines = list(tail)
              selected = set(range(max(0, len(lines) - 35), len(lines)))
              for index, line in enumerate(lines):
                  if re.search(r'error|FAILED|failed|Traceback|regression|Assertion', line, re.IGNORECASE):
                      selected.update(range(max(0, index - 2), min(len(lines), index + 4)))
              message = ''.join(lines[index] for index in sorted(selected))[-16000:]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Windows source build details::' + message, flush=True)
          sys.exit(code)
