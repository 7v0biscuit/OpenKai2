name: Component tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and run native component comparisons
        run: python tools/probes/run.py --skip-retail
      - name: Build ISO verification tests
        run: cmake --build build/probes --config Release --target openkai2_disc_tests openkai2_disc_verify --parallel 2
      - name: ISO verification tests
        run: ctest --test-dir build/probes -C Release --output-on-failure --no-tests=error
  windows-tools:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows development tools without game data
        run: python tools/native/build-windows.py --tools-only --jobs 2
