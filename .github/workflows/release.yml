name: Windows release

on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NSISDIR: ${{ github.workspace }}/.tools/nsis/usr/share/nsis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read release input
        id: release
        shell: python
        run: |
          import json, os
          from pathlib import Path
          config = json.loads(Path('packaging/windows/release-input.json').read_text())
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + config['version']
          elif os.environ['GITHUB_REF_TYPE'] == 'branch' and os.environ['GITHUB_REF_NAME'].startswith('release/'):
              assert os.environ['GITHUB_REF_NAME'] == 'release/v' + config['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('input_commit=' + config['input_commit'] + '\n')
              output.write('version=' + config['version'] + '\n')
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.input_commit }}
          path: release-input
      - name: Verify runtime bundle
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          config = json.loads(Path('packaging/windows/release-input.json').read_text())
          bundle = Path('release-input/OpenKai2-windows-x64.zip')
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == config['bundle_sha256']
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Install verified NSIS compiler
        run: python tools/native/bootstrap-nsis.py --destination .tools/nsis
      - name: Build Windows release assets
        run: python tools/native/build-release.py --bundle release-input/OpenKai2-windows-x64.zip --output dist --version '${{ steps.release.outputs.version }}' --makensis .tools/nsis/usr/bin/makensis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows-validation:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Test launcher update replacement and recovery
        run: python tools/native/test-launcher-update.py
      - name: Test portable executable, installation, and uninstall
        run: python tools/native/test-windows-release.py dist

  publish:
    needs: [package, windows-validation]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Publish development prerelease
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          # A newer release can land while these assets are being tested.
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          version = json.loads(Path('../packaging/windows/release-input.json').read_text())['version']
          current = tuple(map(int, version.split('.')))
          releases = json.loads(subprocess.check_output([
              'gh', 'release', 'list', '--limit', '100', '--json', 'tagName,isDraft']))
          for release in releases:
              match = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)(?:-[A-Za-z0-9.-]+)?', release['tagName'])
              if not release['isDraft'] and match and tuple(map(int, match.groups())) > current:
                  raise SystemExit('A newer release is already published: ' + release['tagName'])
          PY
          VERSION=$(python -c 'import json; print(json.load(open("../packaging/windows/release-input.json"))["version"])')
          TAG="v$VERSION"
          TITLE=$(python -c 'import json; c=json.load(open("../packaging/windows/release-input.json")); print("v" + c["version"])')
          # A manual run from main creates the version tag on the dispatched
          # commit when the release is published; tag pushes reuse their tag.
          TARGET=(--verify-tag)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" = refs/heads/main ] &&
             ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            TARGET=(--target "$GITHUB_SHA")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --prerelease --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" "${TARGET[@]}" --draft --prerelease --title "$TITLE" --notes-file release-notes.md
          fi
          gh release upload "$TAG" OpenKai2.exe OpenKai2-windows-x64.zip OpenKai2-Setup.exe SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --prerelease --latest=false
      - name: Retain the current development release
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          import json, re, subprocess
          from pathlib import Path
          version = json.loads(Path('packaging/windows/release-input.json').read_text())['version']
          tag = 'v' + version
          current_version = tuple(map(int, version.split('.')))
          releases = json.loads(subprocess.check_output([
              'gh', 'release', 'list', '--limit', '100', '--json',
              'tagName,isPrerelease,isDraft,publishedAt']))
          current = next(release for release in releases if release['tagName'] == tag)
          assert current['publishedAt'] and not current['isDraft']
          for release in releases:
              match = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)(?:-[A-Za-z0-9.-]+)?', release['tagName'])
              if (release['tagName'] != tag and release['isPrerelease']
                      and not release['isDraft'] and release['publishedAt']
                      and match and tuple(map(int, match.groups())) < current_version
                      and release['publishedAt'] < current['publishedAt']):
                  subprocess.run(['gh', 'release', 'delete', release['tagName'],
                                  '--yes', '--cleanup-tag'], check=True)
