name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read release input
        id: release
        shell: python
        run: |
          import json, os
          from pathlib import Path
          config = json.loads(Path('packaging/windows/release-input.json').read_text())
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + config['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('input_commit=' + config['input_commit'] + '\n')
              output.write('version=' + config['version'] + '\n')
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.input_commit }}
          path: release-input
      - name: Verify runtime bundle
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          config = json.loads(Path('packaging/windows/release-input.json').read_text())
          bundle = Path('release-input/OpenKai2-windows-x64.zip')
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == config['bundle_sha256']
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version=3.11 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows release assets
        shell: pwsh
        run: |
          python tools/native/build-release.py --bundle release-input/OpenKai2-windows-x64.zip --output dist --version '${{ steps.release.outputs.version }}' --makensis 'C:\Program Files (x86)\NSIS\makensis.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test portable executable, installation, and uninstall
        run: python tools/native/test-windows-release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Publish development prerelease
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          VERSION=$(python -c 'import json; print(json.load(open("../packaging/windows/release-input.json"))["version"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --prerelease --title "OpenKai2 $VERSION - Windows development preview" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --draft --prerelease --title "OpenKai2 $VERSION - Windows development preview" --notes-file release-notes.md
          fi
          gh release upload "$TAG" OpenKai2.exe OpenKai2-windows-x64.zip OpenKai2-Setup.exe SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --prerelease --latest=false
