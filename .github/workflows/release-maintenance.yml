name: Release page maintenance

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-maintenance.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rename current release and remove superseded previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python tools/github/consolidate-releases.py
