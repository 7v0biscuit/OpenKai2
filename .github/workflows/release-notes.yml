name: Release notes

on:
  push:
    branches: [main]
    paths:
      - 'docs/release-notes/**'
      - 'tools/releases/**'
      - 'tests/test_release_names.py'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize published release descriptions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -m unittest discover -s tests -p test_release_names.py
          python tools/releases/sync_notes.py
