name: Release notes

on:
  push:
    branches: [main]
    paths:
      - 'docs/release-notes/**'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize published release descriptions
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          import json, re, subprocess
          from pathlib import Path
          releases = json.loads(subprocess.check_output([
              'gh', 'release', 'list', '--limit', '100', '--json', 'tagName']))
          for release in releases:
              tag = release['tagName']
              if not re.fullmatch(r'v[0-9A-Za-z.-]+', tag):
                  continue
              notes = Path('docs/release-notes') / (tag[1:] + '.md')
              if notes.is_file():
                  subprocess.run(['gh', 'release', 'edit', tag,
                                  '--notes-file', str(notes)], check=True)
                  print('Updated release description:', tag)
